name = "zeus-deployer-cron-monitor"
main = "./index.js"
compatibility_date = "2026-11-05"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_EXISTING_DASHBOARD_D1_NAME"
database_id = "REPLACE_WITH_EXISTING_DASHBOARD_D1_ID"

[observability]
enabled = true
